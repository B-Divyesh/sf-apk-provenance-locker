name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify release source identity
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -e "process.stdout.write(require('./dist/build.json').commit)")" = "$GITHUB_SHA"
      - run: npx cap sync android
      - name: Generate release signing key
        run: keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -storepass android -keypass android -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=APK Provenance Locker,OU=Release,O=Param Factory,L=Internet,ST=Internet,C=IN"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk ../app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../app-release.aab
      - name: Verify Android packages
        run: |
          test "$(stat -c%s app-release.apk)" -gt 1000000
          test "$(stat -c%s app-release.aab)" -gt 1000000
          unzip -l app-release.apk | grep -q 'AndroidManifest.xml'
          unzip -l app-release.aab | grep -q 'manifest/AndroidManifest.xml'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging app-release.apk | grep -q "package: name='in.sociobot.apk_provenance_locker' versionCode='16' versionName='0.5.11'"
          "$AAPT" dump xmltree app-release.apk AndroidManifest.xml > packaged-manifest.txt
          grep -q 'android:allowBackup.*0x0' packaged-manifest.txt
          grep -q 'android:fullBackupContent' packaged-manifest.txt
          grep -q 'android:dataExtractionRules' packaged-manifest.txt
          "$APKSIGNER" verify --verbose --print-certs app-release.apk
          while IFS= read -r FILE; do
            cmp "$FILE" <(unzip -p app-release.apk "assets/public/${FILE#dist/}")
            cmp "$FILE" <(unzip -p app-release.aab "base/assets/public/${FILE#dist/}")
          done < <(find dist -type f -print)
          unzip -p app-release.apk 'assets/public/assets/*.js' > packaged-app.js
          grep -q 'Keep record' packaged-app.js
          grep -q 'Remove record' packaged-app.js
          sha256sum app-release.apk app-release.aab > SHA256SUMS
          node scripts/create-release-provenance.mjs --apk app-release.apk --aab app-release.aab --output RELEASE_PROVENANCE.json
      - name: Run packaged demo-erasure and provenance regression
        run: npm run test:release -- --apk app-release.apk --aab app-release.aab --checksums SHA256SUMS --provenance RELEASE_PROVENANCE.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release.aab
            SHA256SUMS
            RELEASE_PROVENANCE.json
          make_latest: true
          name: APK Provenance Locker ${{ github.ref_name }}
          body: |
            APK Provenance Locker ${{ github.ref_name }}.

            Built from immutable source commit ${{ github.sha }}.

            Verify downloads with SHA256SUMS and RELEASE_PROVENANCE.json. A store release needs the owner's upload key.
      - name: Redownload and verify published source identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:release -- --expected-commit "$GITHUB_SHA"
